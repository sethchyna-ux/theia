[package]
name = "theia-gui"
version = "0.1.0"
description = "High-Performance macOS SSH & SFTP Client"
authors = ["Theia Terminal Craftsman"]
edition = "2021"

[lib]
name = "theia_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.6", features = ["tray-icon"] }
tauri-plugin-log = "2"
window-vibrancy = "0.5"
keyring = "3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
russh = "0.63"
russh-sftp = "3.0"
thiserror = "2"
dirs = "6"
directories = "6"
bytes = "1"
log = "0.4"
rpassword = "7"
async-trait = "0.1"
portable-pty = "0.8"
sha2 = "0.10"
base64 = "0.22"
